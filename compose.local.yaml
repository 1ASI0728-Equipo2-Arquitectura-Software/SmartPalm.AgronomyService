services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartpalm_agronomy
      POSTGRES_USER: smartpalm_agronomy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["${POSTGRES_PORT:-5438}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpalm_agronomy -d smartpalm_agronomy"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["agronomy-postgres:/var/lib/postgresql/data"]
  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: ["isolated"]
    ports: ["${RABBITMQ_PORT:-5672}:5672", "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"]
  agronomy-api:
    build: { context: . }
    profiles: ["api"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AgronomyDatabase: Host=postgres;Port=5432;Database=smartpalm_agronomy;Username=smartpalm_agronomy;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Jwt__Issuer: ${JWT_ISSUER:-smartpalm.identity}
      Jwt__Audience: ${JWT_AUDIENCE:-smartpalm.clients}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:?Set MINIMAX_API_KEY in .env}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M3.1-Flash}
      RabbitMq__Enabled: ${RABBITMQ_ENABLED:-true}
      RabbitMq__Uri: ${RABBITMQ_URI:?Set RABBITMQ_URI in .env}
      Reconciliation__IdentityBaseUrl: ${RECONCILIATION_IDENTITY_BASE_URL:?Set RECONCILIATION_IDENTITY_BASE_URL in .env}
      Reconciliation__CropBaseUrl: ${RECONCILIATION_CROP_BASE_URL:?Set RECONCILIATION_CROP_BASE_URL in .env}
      Reconciliation__InternalBearerToken: ${RECONCILIATION_INTERNAL_BEARER_TOKEN:-}
    ports: ["${AGRONOMY_API_PORT:-5106}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
volumes: { agronomy-postgres: {} }

